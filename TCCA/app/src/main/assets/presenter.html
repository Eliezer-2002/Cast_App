<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
/* #screen is just a plain full-viewport wrapper around two independent, stacked
   layers — see LAYER ARCHITECTURE below. It owns no grid/background of its own
   any more (each layer owns its own). */
#screen{position:fixed;inset:0;}

/* ══════════════════════════════════════
   LAYER ARCHITECTURE — Sources, Songs and Bible used to all share one flat
   #screen (whichever function ran last won, hiding/overwriting whatever the
   others had drawn). They're now two independent, always-present layers:
     #sources-layer  (z-index 1) — the PERMANENT base layer. Only showGap()/
       showCamera()/showPdf()/clearDisplay() ever touch it (clock, blank,
       custom text, image, video, USB/capture camera, PDF — i.e. Sources).
     #overlay-layer   (z-index 2) — drawn on TOP of Sources. Only showContent()/
       showSplit()/clearOverlay() ever touch it (Song stanzas, Bible verses/
       Split). Starts fully transparent (no background of its own) so Sources
       shows straight through until a Song/Bible slide actually sets one; the
       Blank quick-action (clearOverlay()) puts it back to that same empty
       state — see clearOverlay() below — without touching Sources at all.
   Neither layer's function ever reaches into the other's elements, so
   switching Sources/Songs/Bible can never replace, delete, or overwrite the
   other layer's current content — they coexist exactly like a broadcast
   PGM (base) + key/overlay (Song/Bible) pair.
══════════════════════════════════════ */
#sources-layer,#overlay-layer{
  position:absolute;inset:0;
  display:grid;
  grid-template-rows:1fr;
  grid-template-areas:"content";
  transition:background 0.4s ease;
  will-change:opacity,transform,background;
}
#sources-layer{z-index:1;background:#000;}
#overlay-layer{z-index:2;background:transparent;}
#overlay-layer.slide-title-only{grid-template-rows:2fr 8fr;grid-template-areas:"title" "content";}
#overlay-layer.slide-title-hint{grid-template-rows:2fr 7fr 1fr;grid-template-areas:"title" "content" "hint";}
/* #title-area's own grid-area:content (below) is only a harmless fallback for
   while it's display:none in the no-title case — without this override it
   would stack directly on top of #content-area in the content cell instead of
   landing in the dedicated top "title" row reserved for it above. */
#overlay-layer.slide-title-only #title-area,
#overlay-layer.slide-title-hint #title-area{grid-area:title;}
/* title-area/content-area/source-content-area/hint-area are the GRID CELLS —
   a fixed proportion of their layer, never affected by their own text content
   (so long lyrics can never push the title out of position). Each flex-
   centers a single naturally-sized text child; fitTextToBox() binary-searches
   THAT child's font-size against the cell's fixed box. Measuring a grid item
   stretched to fill its own cell would always "fit" by definition and tell us
   nothing — the child has to be free to size itself first. */
#title-area{
  grid-area:content; /* harmless fallback while display:none in the default (no-title) state */
  min-width:0;min-height:0;
  display:none;
  align-items:center;justify-content:center;
  text-align:center;
  padding:10px 56px;
  max-width:100%;
  margin:0 auto;
  box-sizing:border-box;
  transition:max-width .2s ease;
}
#title{
  font-size:24px;color:#9b59b6;
  font-weight:700;font-family:sans-serif;
  word-break:break-word;
  line-height:1.3;
  letter-spacing:0;
  transition:color .37s ease,letter-spacing .15s ease;
}
/* Shared cell layout for the overlay's song/verse text (#content-area) and the
   sources layer's clock/custom-text (#source-content-area) — same fixed-cell/
   naturally-sized-child pattern as #title-area, just on two independent layers. */
#content-area,#source-content-area{
  grid-area:content;
  min-width:0;min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 56px;
}
#content{
  font-size:30px;color:#ffffff;
  text-align:center;line-height:1.7;
  white-space:pre-wrap;font-family:sans-serif;
  max-width:100%;display:none;
  word-break:break-word;
  letter-spacing:0;
  transition:color .37s ease,letter-spacing .15s ease;
}
#clock{
  font-size:72px;color:#ffffff;
  font-weight:700;font-family:sans-serif;
  letter-spacing:2px;
  transition:color .37s ease;
}
#date{
  font-size:22px;color:#aaaaaa;
  margin-top:8px;font-family:sans-serif;
}
#custom-text{
  font-size:30px;color:#ffffff;
  text-align:center;white-space:pre-wrap;
  font-family:sans-serif;display:none;
  max-width:100%;
  word-break:break-word;
  letter-spacing:0;
  transition:color .37s ease,letter-spacing .15s ease;
}
/* MEDIA FRAME — wraps #media/#video/#pdf-canvas/#pptx-fit so an Image/Video/
   Image-Collection/PDF/PPTX Source can be given a Display Mode (fit/cover/
   fill) and a Frame Ratio (see setSourceFrame() below) without touching the
   original file or the layer underneath. #media-frame-box is sized to the
   configured ratio in JS (_applyMediaFrameBox — CSS aspect-ratio alone can't
   reliably constrain-by-the-shorter-axis across WebView versions) and
   centered by the outer flex frame; 'auto' ratio just fills the frame
   exactly like the old fixed width:100%/height:100% behavior. Zoom/pan
   (setSourceZoom()) is a transform on the media element itself, inside that
   box, so it never affects layout. #pdf-canvas is real pdfjs-dist output, so
   it gets the same CSS object-fit treatment as #media/#video; #pptx-fit/
   #pptx-inner render real DOM (@aiden0z/pptx-renderer) and get the manual
   equivalent — see _applyPptxFit() below. */
#media-frame{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
#media-frame-box{ position:relative; width:100%; height:100%; overflow:hidden; flex-shrink:0; }
#media-frame-box.fit-contain #media,#media-frame-box.fit-contain #video,#media-frame-box.fit-contain #pdf-canvas{ object-fit:contain; }
#media-frame-box.fit-cover #media,#media-frame-box.fit-cover #video,#media-frame-box.fit-cover #pdf-canvas{ object-fit:cover; }
#media-frame-box.fit-fill #media,#media-frame-box.fit-fill #video,#media-frame-box.fit-fill #pdf-canvas{ object-fit:fill; }
#media{
  position:absolute;inset:0;width:100%;height:100%;
  display:none;transform-origin:center center;
}
#video{
  position:absolute;inset:0;width:100%;height:100%;
  display:none;transform-origin:center center;
}
#camera-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;background:#000;display:none;
}
/* PDF is now rendered for real (pdfjs-dist) onto this canvas instead of the
   WebView's native PDF plugin — same frame/zoom mechanism as #media/#video
   (object-fit above, transform via _applyMediaZoomTransform()). */
#pdf-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  background:#fff;display:none;transform-origin:center center;
}
/* PPTX renders real HTML/SVG DOM (via @aiden0z/pptx-renderer), not a plain
   media element, so it can't use CSS object-fit like #media/#video/#pdf-canvas
   do. #pptx-fit gets a JS-computed contain/cover/fill scale (Display Mode —
   see _applyPptxFit()); #pptx-inner is sized to the deck's own intrinsic
   slideWidth x slideHeight and is what the renderer draws into, then gets the
   SAME zoom/pan transform as every other media type (_applyMediaZoomTransform()). */
#pptx-fit{
  position:absolute;inset:0;width:100%;height:100%;
  display:none;overflow:hidden;background:#fff;
}
#pptx-inner{
  position:absolute;top:50%;left:50%;transform-origin:0 0;
}
@media (prefers-reduced-motion:reduce){
  #sources-layer,#overlay-layer,#title,#content,#clock,#custom-text{transition:none;}
}
/* Hint now lives in its own dedicated grid row (see #overlay-layer.slide-title-hint)
   instead of floating as a fixed corner overlay, so it gets real, predictable
   space and can be auto-fit like everything else — never clipped. */
#hint-area{
  grid-area:content; /* harmless fallback while display:none outside .slide-title-hint */
  min-width:0;min-height:0;
  display:none;
  align-items:center;justify-content:center;
  text-align:center;
  padding:2px 56px 10px;
}
#hint{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:26px;color:rgba(255,255,255,0.6);
  font-family:sans-serif;font-style:italic;
  max-width:100%;
  word-break:break-word;
  transition:color .37s ease;
}
#hint span{min-width:0;} /* lets the text actually wrap instead of resisting shrink as a flex item */
/* Bible split — strict 2 rows (references : verses = 2:10) × 2 equal columns.
   Left/right are fully independent grid cells; each pane's reference/verse is
   fit to ITS OWN cell only (see refitAll()), so the two sides can land on
   completely different font sizes without affecting each other — same
   wrapper-cell/naturally-sized-child pattern as #title-area/#content-area. */
#split-screen{
  position:absolute;inset:0;display:none;
  grid-template-columns:10fr 10fr;
  grid-template-rows:2fr 10fr;
  grid-template-areas:"refL refR" "textL textR";
}
.split-ref-area,.split-text-area{
  min-width:0;min-height:0;
  display:flex;align-items:center;justify-content:center;
}
#split-ref-area-l{grid-area:refL;padding:18px 24px 6px;}
#split-ref-area-r{grid-area:refR;padding:18px 24px 6px;border-left:1px solid rgba(255,255,255,0.15);}
#split-text-area-l{grid-area:textL;padding:6px 34px 32px;}
#split-text-area-r{grid-area:textR;padding:6px 34px 32px;border-left:1px solid rgba(255,255,255,0.15);}
.split-ref{
  font-size:22px;color:#9b59b6;font-weight:700;
  text-align:center;font-family:sans-serif;
  word-break:break-word;
  transition:color .37s ease;
}
.split-text{
  font-size:26px;color:#ffffff;text-align:center;line-height:1.6;
  white-space:pre-wrap;font-family:sans-serif;max-width:100%;
  word-break:break-word;transition:color .37s ease;
}
</style>
</head>
<body>
<div id="screen">
  <div id="sources-layer">
    <div id="source-content-area">
      <div id="clock"></div>
      <div id="date"></div>
      <div id="custom-text"></div>
    </div>
    <div id="media-frame">
      <div id="media-frame-box" class="fit-contain">
        <img id="media" src="">
        <video id="video" muted playsinline></video>
        <canvas id="pdf-canvas"></canvas>
        <div id="pptx-fit"><div id="pptx-inner"></div></div>
      </div>
    </div>
    <video id="camera-video" autoplay muted playsinline></video>
  </div>
  <div id="overlay-layer">
    <div id="title-area">
      <div id="title"></div>
    </div>
    <div id="content-area">
      <div id="content"></div>
    </div>
    <div id="hint-area">
      <div id="hint"></div>
    </div>
    <div id="split-screen">
      <div class="split-ref-area" id="split-ref-area-l"><div class="split-ref" id="split-ref-l"></div></div>
      <div class="split-ref-area" id="split-ref-area-r"><div class="split-ref" id="split-ref-r"></div></div>
      <div class="split-text-area" id="split-text-area-l"><div class="split-text" id="split-text-l"></div></div>
      <div class="split-text-area" id="split-text-area-r"><div class="split-text" id="split-text-r"></div></div>
    </div>
  </div>
</div>

<script>
var clockInterval = null;
// Sources and Overlay are independent layers now, so each tracks its own
// "what's currently showing" mode separately — see LAYER ARCHITECTURE above.
// currentSourceMode: 'clock'|'gap'|'camera'|'pdf' (showGap/showCamera/showPdf/clearDisplay)
// currentOverlayMode: 'none'|'song'|'verse'|'split' (showContent/showSplit/clearOverlay)
var currentSourceMode = 'clock';
var currentOverlayMode = 'none';
var presenterTransitionTimer = null;   // kept for compatibility with any external reference; layer timers below are what's actually used
var _requestedFontSize = 30;       // OVERLAY content/verse/split-text ceiling (sent fresh with every showContent/showSplit call)
var _requestedSourceFontSize = 30; // SOURCES custom-text ceiling (sent fresh with every showGap call) — kept separate from
                                    // _requestedFontSize so a Source's custom-text size never leaks into the Song/Bible overlay's
                                    // sizing ceiling (or vice versa) the next time refitAll() runs (e.g. on resize).
// Heading/reference size has no user control any more — it's always fully
// automatic, so this simply stays at the hard ceiling (FIT_MAX_HEADING) rather
// than tracking a live-adjustable request like _requestedFontSize does.
var _requestedTitleFontSize = 48;

// Hard ceilings the auto-fit system never exceeds. Minimums mirror the
// smallest size the design considers still readable.
var FIT_MIN_HEADING=12, FIT_MAX_HEADING=48;
var FIT_MIN_CONTENT=16, FIT_MAX_CONTENT=96;
var FIT_MIN_HINT=10, FIT_MAX_HINT=26;

function isPreviewPresenter(){
  return location.hash.indexOf('preview') !== -1 || location.search.indexOf('preview') !== -1;
}

// ============================================================
// SLIDE TRANSITION — mirrors controller.html's own Preview → Live Transition
// system (fadeSettings/FADE_TYPE_TRANSFORMS) so the actual presenter output
// (this file, loaded identically by the Preview iframe, the Live iframe, AND
// the real external cast display) performs the SAME selected type/duration/
// easing rather than a fixed built-in fade. setSlideTransition() is called
// from controller.html (via the iframe bridge) and from the Android bridge
// (via CastPresentation.runJS) right before every screen-changing call, so
// this is always in sync with whichever category (Songs/Bible/Sources) is
// currently on screen.
// ============================================================
// _transDuration ("Switch Duration" in controller.html's Appearance panel) is
// used for the TEXT-only animation when a Song/Bible slide changes while
// that same presentation is already active (see animateTextEls()).
// _transEnterDuration ("Enter Duration") is the separate duration used only
// for the whole-layer (background+text) fade-in when Song/Bible/Split
// content starts from an inactive overlay (see showContent()/showSplit()
// below, which pick one or the other based on currentOverlayMode — never on
// whether a new slide was merely selected). Both share the same _transType/
// _transEasing — there's only one Type/Easing setting per category, not a
// separate one for Enter vs Switch.
var _transType='fade', _transDuration=260, _transEnterDuration=260, _transEasing='ease';
// One-shot instant flag — set true by the CUT quick-action (via setSlideTransition's
// 4th arg) for exactly the one screen-changing call that immediately follows it, then
// consumed/cleared by animateLayer() below. Kept fully separate from _transType/
// _transDuration/_transEasing (the persistent, user-configured Transition settings)
// so CUT never reads, modifies, or depends on those — it just skips animateLayer()'s
// whole opacity/transform/background dance for that one call, which is the only way
// to make it truly instant (a 0ms CSS transition still runs a reflow/animation frame).
var _transInstant=false;
var TRANSITION_OUT_TRANSFORMS={fade:'',slide:'translateX(24px)',zoom:'scale(.92)'};
function setSlideTransition(type,duration,easing,instant,enterDuration){
  if(type)_transType=type;
  if(duration!=null)_transDuration=duration;
  if(easing)_transEasing=easing;
  _transInstant=!!instant;
  if(enterDuration!=null)_transEnterDuration=enterDuration;
}
// Runs the transition on ONE layer at a time (layerId: 'sources-layer' or
// 'overlay-layer') — each layer keeps its own timer so animating one (e.g.
// blanking the overlay) can never cut off or interfere with the other (e.g. a
// source's background still mid-transition underneath). SOURCES ONLY now —
// see animateTextEls() below for the overlay's TEXT-only equivalent, used by
// showContent()/showSplit() instead of this, so a normal Song/Bible slide
// change never touches (or re-transitions) the overlay's background at all.
// Same timer map is reused by clearOverlay()'s slow Blank fade-out (keyed by
// 'overlay-layer') and by animateTextEls()'s per-group keys, so a new slide
// change always cancels a still-running Blank/older text animation on the
// same target before it can interfere.
var _layerTransitionTimers={};
// ms (optional): duration override for THIS call — falls back to
// _transDuration when omitted (every existing 'sources-layer' call site, and
// nothing else). The overlay's ENTER path (see showContent()/showSplit()
// below) passes _transEnterDuration explicitly here so the whole-layer
// fade-in uses "Enter Duration" instead of "Switch Duration".
function animateLayer(layerId,ms){
  var layer=document.getElementById(layerId);
  if(!layer)return;
  if(_layerTransitionTimers[layerId]){clearTimeout(_layerTransitionTimers[layerId]);_layerTransitionTimers[layerId]=null;}
  if(_transInstant){
    // CUT: apply the already-changed background/content with NO transition of any
    // kind (opacity, transform, OR the layer's own CSS "background 0.4s ease") —
    // style.transition='none' overrides that class-level rule too, not just the
    // ones set below, so the background swap is instant as well.
    _transInstant=false;
    layer.style.transition='none';
    layer.style.opacity='';
    layer.style.transform='';
    return;
  }
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    layer.style.transition='';layer.style.opacity='';layer.style.transform='';
    return;
  }
  var fromTransform=TRANSITION_OUT_TRANSFORMS[_transType]||'';
  if(ms==null)ms=_transDuration||0;
  layer.style.transition='none';
  layer.style.opacity='.22';
  layer.style.transform=fromTransform;
  void layer.offsetWidth; // commit the start state before the transition below picks it up
  layer.style.transition='opacity '+ms+'ms '+_transEasing+', transform '+ms+'ms '+_transEasing+', background 0.4s ease';
  layer.style.opacity='1';
  layer.style.transform='none';
  _layerTransitionTimers[layerId]=setTimeout(function(){
    layer.style.transition='';layer.style.opacity='';layer.style.transform='';
  },ms);
}
// Text-only equivalent of animateLayer() above — dips+eases opacity/transform
// on a specific SET of elements (never the parent #overlay-layer itself, so
// its background is never touched/re-transitioned) using the SAME _transType/
// _transEasing the caller already resolved via controller.html's
// setSlideTransition() bridge, plus the explicit `ms` the caller passes in
// (Switch Duration for a normal slide change — Enter never calls this, see
// showContent()/showSplit() below, which use animateLayer() instead). Used for:
//   'overlay-text' — title-area+content-area+hint-area together (Song/Bible
//     single slide changes — see showContent() below).
//   'split-left' / 'split-right' — each Split side's [ref-area,text-area]
//     pair independently (see showSplit() below), so changing only one side
//     never animates the other.
// `instant` must be read from _transInstant and consumed (reset to false) by
// the CALLER exactly once per showContent()/showSplit() invocation — never
// read here directly — because showSplit() may need to call this twice (left
// and right) in one invocation, and _transInstant is a one-shot flag that
// must not be silently consumed by the first of those two calls.
function animateTextEls(timerId,els,instant,ms){
  if(_layerTransitionTimers[timerId]){clearTimeout(_layerTransitionTimers[timerId]);_layerTransitionTimers[timerId]=null;}
  els=(els||[]).filter(function(e){return !!e;});
  if(!els.length)return;
  if(instant||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
    els.forEach(function(el){el.style.transition='none';el.style.opacity='';el.style.transform='';});
    return;
  }
  var fromTransform=TRANSITION_OUT_TRANSFORMS[_transType]||'';
  if(ms==null)ms=_transDuration||0;
  els.forEach(function(el){el.style.transition='none';el.style.opacity='.22';el.style.transform=fromTransform;});
  void els[0].offsetWidth; // commit the start state before the transition below picks it up
  els.forEach(function(el){
    el.style.transition='opacity '+ms+'ms '+_transEasing+', transform '+ms+'ms '+_transEasing;
    el.style.opacity='1';
    el.style.transform='none';
  });
  _layerTransitionTimers[timerId]=setTimeout(function(){
    els.forEach(function(el){el.style.transition='';el.style.opacity='';el.style.transform='';});
  },ms);
}
function reportPresenterViewport(){
  if(isPreviewPresenter())return;
  if(window.Android&&typeof Android.reportViewport==='function'){
    Android.reportViewport(window.innerWidth,window.innerHeight);
  }
}

// ============================================================
// AUTO-FIT — one reusable system for every piece of slide text (title/
// reference, lyric/verse, hint, both split panes). Finds the LARGEST font size
// within [minPx,maxPx] that lets the element's COMPLETE content fit inside its
// container — both width and height — so nothing is ever truncated, clipped,
// or pushed outside its box. Never uses overflow:hidden to hide excess text;
// it always finds a size (down to minPx) that actually shows everything.
//
//   fitTextToBox(el, area, minPx, maxPx) — works on elements directly.
//   autoFit(elId, areaId, minPx, maxPx)  — thin id-based wrapper, kept for the
//     existing call-site style used throughout this file.
//
// area must be the element's own dedicated container (a fixed-size grid/flex
// cell, e.g. #title-area for #title) — NOT an ancestor that also contains
// other visible text, and never the element itself (a grid/flex item stretched
// to fill its own cell would always "fit" by definition and tell us nothing —
// the text child has to be free to size itself first). Binary search over a
// ~90-step integer range is ~7 reflows, not hundreds.
// ============================================================
function fitTextToBox(el,area,minPx,maxPx){
  if(!el||el.style.display==='none')return;
  if(!area||!area.clientWidth||!area.clientHeight)return;
  var maxW=area.clientWidth,maxH=area.clientHeight;
  function fits(px){
    el.style.fontSize=px+'px';
    return el.offsetHeight<=maxH&&el.offsetWidth<=maxW;
  }
  if(fits(maxPx))return; // complete content already fits at the ceiling — use it as-is
  var lo=minPx,hi=maxPx,best=lo;
  fits(lo); // even if the minimum doesn't fit, show the minimum (readable) rather than clipping
  while(lo<=hi){
    var mid=Math.floor((lo+hi)/2);
    if(fits(mid)){best=mid;lo=mid+1;}
    else{hi=mid-1;}
  }
  el.style.fontSize=best+'px';
}
function autoFit(elId,areaId,minPx,maxPx){
  fitTextToBox(document.getElementById(elId),document.getElementById(areaId||'content-area'),
    minPx||FIT_MIN_CONTENT,maxPx||FIT_MAX_CONTENT);
}

// Re-fits whatever is actually visible right now — used after anything that
// could change wrapping/sizing (resize, font weight/width changes, live font-
// size slider) instead of duplicating "what's currently showing" per call site.
// Split's left/right panes are always fit independently of each other — a
// short left verse and a very long right verse can land on completely
// different sizes, each the largest that fits its own pane. Sources' custom-
// text and the overlay's title/content/hint are independent of each other too
// (separate layers) and are simply fit whenever each is actually visible.
function refitAll(){
  if(currentOverlayMode==='split'){
    autoFit('split-ref-l','split-ref-area-l',FIT_MIN_HEADING,Math.min(_requestedTitleFontSize,FIT_MAX_HEADING));
    autoFit('split-ref-r','split-ref-area-r',FIT_MIN_HEADING,Math.min(_requestedTitleFontSize,FIT_MAX_HEADING));
    autoFit('split-text-l','split-text-area-l',FIT_MIN_CONTENT,Math.min(_requestedFontSize,FIT_MAX_CONTENT));
    autoFit('split-text-r','split-text-area-r',FIT_MIN_CONTENT,Math.min(_requestedFontSize,FIT_MAX_CONTENT));
  } else {
    if(document.getElementById('title').style.display!=='none'){
      autoFit('title','title-area',FIT_MIN_HEADING,Math.min(_requestedTitleFontSize,FIT_MAX_HEADING));
    }
    if(document.getElementById('content').style.display!=='none'){
      autoFit('content','content-area',FIT_MIN_CONTENT,Math.min(_requestedFontSize,FIT_MAX_CONTENT));
    }
    if(document.getElementById('hint').style.display!=='none'){
      autoFit('hint','hint-area',FIT_MIN_HINT,FIT_MAX_HINT);
    }
  }
  if(document.getElementById('custom-text').style.display!=='none'){
    autoFit('custom-text','source-content-area',FIT_MIN_CONTENT,Math.min(_requestedSourceFontSize,FIT_MAX_CONTENT));
  }
}

function showClock(){
  document.getElementById('clock').style.display='block';
  document.getElementById('date').style.display='block';
  tickClock();
  if(clockInterval)clearInterval(clockInterval);
  clockInterval=setInterval(tickClock,1000);
}
function hideClock(){
  if(clockInterval){clearInterval(clockInterval);clockInterval=null;}
  document.getElementById('clock').style.display='none';
  document.getElementById('date').style.display='none';
}
function tickClock(){
  var now=new Date();
  var h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  var ampm=h>=12?'PM':'AM';
  h=h%12||12;
  document.getElementById('clock').textContent=pad(h)+':'+pad(m)+':'+pad(s)+' '+ampm;
  document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function pad(n){return n<10?'0'+n:n;}

// ============================================================
// SOURCE CONTROLS RUNTIME — lightweight, non-transitional style/state updates
// for the Cast Control "Sources → swipe → side panel" controls (Image/Video/
// Image Collection Display Mode + Frame Ratio + Zoom/Pan, Video transport,
// Ideal Screen Clock font color/size). These never go through
// _isPresenterScreenCall()/animateLayer() — they only restyle or operate on
// whatever is ALREADY showing on the Sources layer, so calling them never
// presents/changes WHICH source is on screen and never re-triggers a slide
// transition. controller.html reaches this file's local iframes directly
// (same-origin contentWindow calls) and the real external cast display via
// the generic Android.sourceCommand() passthrough — see MainActivity.java.
// ============================================================
var FRAME_RATIOS={'1:1':1,'4:3':4/3,'16:9':16/9,'16:10':16/10,'21:9':21/9};
var _srcDisplayMode='fit', _srcFrameRatio='auto', _srcZoom=1, _srcPanX=0, _srcPanY=0;
// PPTX's intrinsic slide size (px, set by the renderer module once a deck
// loads) and the resulting Display Mode fit-scale — see _applyPptxFit()
// below. #pptx-inner is real DOM (not a plain media element), so it can't
// use CSS object-fit like #media/#video/#pdf-canvas do; this is the manual
// equivalent, computed here so all frame/zoom math stays in one place.
var _pptxSlideW=0, _pptxSlideH=0, _pptxFitScaleX=1, _pptxFitScaleY=1;

// Sizes #media-frame-box to the configured Frame Ratio, constrained to fit
// within whatever this presenter.html instance's own viewport actually is
// (the 1920x1080-then-CSS-scaled iframe for Preview/Live, or the real
// external display's native resolution for the cast Presentation) — computed
// in JS rather than via CSS aspect-ratio so it degrades safely on any WebView
// version and always fits the shorter axis. 'auto'/unrecognized ratio simply
// fills the frame exactly like the original fixed width:100%/height:100%.
function _applyMediaFrameBox(){
  var box=document.getElementById('media-frame-box');
  if(!box)return;
  var ratio=FRAME_RATIOS[_srcFrameRatio];
  if(!ratio){ box.style.width='100%'; box.style.height='100%'; return; }
  var cw=document.documentElement.clientWidth||window.innerWidth||1;
  var ch=document.documentElement.clientHeight||window.innerHeight||1;
  if((cw/ch)>ratio){ box.style.height='100%'; box.style.width=Math.round(ch*ratio)+'px'; }
  else { box.style.width='100%'; box.style.height=Math.round(cw/ratio)+'px'; }
}
window.addEventListener('resize',_applyMediaFrameBox);

// Called by controller.html (image/video/image-collection controls) whenever
// the source's Display Mode or Frame Ratio setting changes, AND once right
// after every showGap('image'/'video',...) call so a freshly-staged source
// immediately reflects its own saved settings instead of momentarily showing
// the previous source's frame/fit. Never touches WHICH file is loaded.
function setSourceFrame(displayMode,frameRatio){
  _srcDisplayMode=displayMode||'fit';
  _srcFrameRatio=frameRatio||'auto';
  var box=document.getElementById('media-frame-box');
  if(box){
    box.classList.remove('fit-contain','fit-cover','fit-fill');
    box.classList.add(_srcDisplayMode==='fullscreen'?'fit-fill':(_srcDisplayMode==='cover'?'fit-cover':'fit-contain'));
  }
  _applyMediaFrameBox();
  _applyPptxFit();
  _applyMediaZoomTransform();
  // setSourceFrame() is always called right AFTER showPdf() on a fresh
  // stage/goLive (see controller.html's stageSourceToPreview/goLive: content
  // first, then style) — that means the PDF canvas's very first render can
  // land before the frame box has its final Frame-Ratio size. Re-rendering
  // here (module-defined, a no-op until a PDF is actually loaded) keeps the
  // canvas at full resolution for the box it actually ends up in, without
  // reordering the existing stage/goLive pipeline other source types rely on.
  if(typeof window.__reapplyPdfAtCurrentBox==='function')window.__reapplyPdfAtCurrentBox();
}
// Recomputes #pptx-inner's Display Mode fit-scale (contain/cover/fill) from
// the loaded deck's own intrinsic slideWidth/slideHeight vs the current
// #media-frame-box size — the manual, DOM equivalent of the object-fit rules
// #media/#video/#pdf-canvas already get for free from CSS. A no-op until a
// PPTX slide has actually loaded (_pptxSlideW>0).
function _applyPptxFit(){
  if(!_pptxSlideW||!_pptxSlideH)return;
  var box=document.getElementById('media-frame-box');
  if(!box)return;
  var bw=box.clientWidth||1, bh=box.clientHeight||1;
  var sx=bw/_pptxSlideW, sy=bh/_pptxSlideH;
  if(_srcDisplayMode==='fullscreen'){ _pptxFitScaleX=sx; _pptxFitScaleY=sy; }
  else if(_srcDisplayMode==='cover'){ var sc=Math.max(sx,sy); _pptxFitScaleX=sc; _pptxFitScaleY=sc; }
  else { var sf=Math.min(sx,sy); _pptxFitScaleX=sf; _pptxFitScaleY=sf; }
}
// Pan is a percentage of the media's OWN (unscaled) box size in each axis;
// clamping it to ±(zoom-1)*50 keeps the zoomed image's edge from ever being
// pulled past the frame boundary (no infinite pan / no revealed empty space)
// regardless of how far a repeated Pan button press tries to push it — see
// _applyMediaZoomTransform()'s translate-then-scale order below, which is
// exactly what makes that fixed-percentage bound correct.
function _clampPan(zoom,pan){
  var maxPan=Math.max(0,(zoom-1)*50);
  return Math.max(-maxPan,Math.min(maxPan,pan||0));
}
function _applyMediaZoomTransform(){
  var z=Math.max(1,Math.min(4,_srcZoom||1));
  var px=_clampPan(z,_srcPanX), py=_clampPan(z,_srcPanY);
  var t='translate('+px+'%,'+py+'%) scale('+z+')';
  var media=document.getElementById('media'), video=document.getElementById('video'), pdf=document.getElementById('pdf-canvas');
  if(media)media.style.transform=t;
  if(video)video.style.transform=t;
  if(pdf)pdf.style.transform=t;
  // #pptx-inner is intrinsically sized (not width:100%/height:100% like the
  // three elements above), so it's centered via translate(-50%,-50%) from a
  // top:50%/left:50% position (see presenter.html's <style>) and its Display
  // Mode fit-scale (_applyPptxFit()) is folded into the same scale() as zoom,
  // rather than needing a second wrapper element.
  var pptxInner=document.getElementById('pptx-inner');
  if(pptxInner)pptxInner.style.transform='translate(-50%,-50%) translate('+px+'%,'+py+'%) scale('+(_pptxFitScaleX*z)+','+(_pptxFitScaleY*z)+')';
}
function setSourceZoom(zoom,panX,panY){
  _srcZoom=zoom||1; _srcPanX=panX||0; _srcPanY=panY||0;
  _applyMediaZoomTransform();
}

// Ideal Screen Clock — font color/size only (never touches #date, which has
// no user-facing control in this feature). Re-applied fresh every time the
// Clock source is (re)staged, same pattern as setSourceFrame() above.
function setClockStyle(color,size){
  var clock=document.getElementById('clock');
  if(!clock)return;
  if(color)clock.style.color=color;
  if(size)clock.style.fontSize=size+'px';
}

// Video end behavior — 'loop' reuses the native <video loop> attribute
// (matches this app's original always-loop behavior when a video source is
// the default 'loop' setting — see controller.html's confirmAddSource()).
// 'stop'/'presentSource' both leave loop off; 'presentSource' is completed by
// controller.html listening for the native 'ended' event below.
function setVideoEndBehavior(behavior){
  var v=document.getElementById('video');
  if(v)v.loop=(behavior==='loop');
}
// Video transport — Play/Pause/Restart/Seek. Deliberately no volume/mute
// control here (the <video> stays permanently muted — see the `muted`
// attribute in the markup above; this app never plays Source audio).
function videoControl(action,arg){
  var v=document.getElementById('video');
  if(!v)return;
  var dur=isFinite(v.duration)?v.duration:0;
  if(action==='play'){ v.play().catch(function(){}); }
  else if(action==='pause'){ v.pause(); }
  else if(action==='restart'){ v.currentTime=0; v.play().catch(function(){}); }
  else if(action==='seekBy'){ v.currentTime=Math.max(0,Math.min(dur,(v.currentTime||0)+(arg||0))); }
  else if(action==='seekTo'){ v.currentTime=Math.max(0,Math.min(dur,arg||0)); }
}
// Polled by controller.html (only while a Video source's control panel is
// open) to drive the timeline/current-time UI — a plain return value, not a
// screen-changing call, so it's read directly rather than via presenterCall/
// previewCall's fire-and-forget _runFrameCall.
function getVideoStatus(){
  var v=document.getElementById('video');
  if(!v)return null;
  return {currentTime:v.currentTime||0,duration:isFinite(v.duration)?v.duration:0,paused:v.paused};
}
(function(){
  var v=document.getElementById('video');
  if(!v)return;
  // Fires only when the video actually reaches its end with loop=false (the
  // 'stop' and 'presentSource' end-behaviors) — never for 'loop', which the
  // browser handles internally without ever dispatching 'ended'. Reaches
  // controller.html directly (same-origin contentWindow) for the Preview/Live
  // iframes; harmlessly no-ops for the real external cast Presentation, which
  // has no such parent (see controller.html's __onSourceVideoEnded and its
  // own comment on why "Present Another Source" is driven from the local
  // mirror iframes rather than needing a new native Android callback).
  v.addEventListener('ended',function(){
    try{
      if(window.parent&&window.parent!==window&&typeof window.parent.__onSourceVideoEnded==='function'){
        window.parent.__onSourceVideoEnded(window.__frameRole||null);
      }
    }catch(e){}
  });
})();

// Releases the camera <video>'s srcObject (without stopping the underlying
// MediaStream — that stream is owned by controller.html and may still be in
// use elsewhere) and hides the PDF/PPTX surfaces. Called whenever a DIFFERENT
// Source (clock/blank/text/image/video/pdf/ppt) takes over the sources layer
// — a purely intra-layer concern, never called by the overlay's
// showContent()/showSplit().
function _releaseSpecialSurfaces(){
  var cam=document.getElementById('camera-video');
  if(cam){cam.pause();cam.srcObject=null;cam.style.display='none';}
  var pdf=document.getElementById('pdf-canvas');
  if(pdf)pdf.style.display='none';
  var pptx=document.getElementById('pptx-fit');
  if(pptx)pptx.style.display='none';
}

// Clears the overlay's title/hint grid-ratio state (see #overlay-layer.slide-
// title-only/.slide-title-hint in the CSS) back to the single full-screen
// "content" row — called by every overlay mode that doesn't use the song/
// Bible title+content+hint layout (clearOverlay/showSplit; showContent sets
// its own state directly). Only ever touches #overlay-layer — Sources has no
// equivalent layout modifiers.
function _clearSlideLayout(){
  document.getElementById('overlay-layer').classList.remove('slide-title-only','slide-title-hint');
}

// Tracks the last rendered ref/text for each Split side so showSplit() below
// can tell which side(s) actually changed — controller.html's
// pushSplitToPresenter() always sends BOTH sides' full current state on
// every call (even when only one side was touched), so this file has to do
// its own diffing rather than trusting the call to mean "both changed".
// Reset to null by clearOverlay()'s finishClear() (Blank) so a later
// showSplit() always treats both sides as fresh instead of comparing against
// stale pre-Blank text.
var _splitLastL={ref:null,text:null}, _splitLastR={ref:null,text:null};
// Called by Android bridge — show two Bible verses side-by-side (Split tab).
// OVERLAY ONLY: never touches #sources-layer or any Source element, so
// whatever Source is currently showing keeps running underneath untouched.
// The background is set directly here (no transition) and each side's
// ref+text is animated independently via animateTextEls() — see that
// function's comment — so the background and the OTHER side never move when
// only one side's verse actually changed.
function showSplit(leftRef,leftText,rightRef,rightText,bg,titleColor,textColor,fontSize){
  _requestedFontSize=fontSize||26;
  var overlay=document.getElementById('overlay-layer');
  var newBg=(bg&&bg.startsWith('data:'))?('url('+bg+') center/cover no-repeat'):(bg||'transparent');
  // Cancel a still-running Blank exit-fade on THIS layer and reset it to a
  // normal resting state FIRST — a new selection must always immediately take
  // over from a fading-out Blank, never be delayed or later wiped out by that
  // fade's deferred finishClear() cleanup (clearOverlay()'s own setTimeout).
  // animateLayer()'s own ENTER path already does this as a side effect of its
  // dip, but the SWITCH path below (animateTextEls(), text-only) never
  // touches this layer's opacity/transform at all, so without this the layer
  // would keep fading to transparent — and the pending finishClear() would
  // still fire later and hide the just-shown content — regardless of which
  // path runs. Harmless no-op when nothing was pending.
  if(_layerTransitionTimers['overlay-layer']){clearTimeout(_layerTransitionTimers['overlay-layer']);_layerTransitionTimers['overlay-layer']=null;}
  // transition:'none' first — #overlay-layer still carries a class-level
  // "background 0.4s ease" rule (used only by clearOverlay()'s Blank fade,
  // which sets its own transition value whenever it actually runs); without
  // suppressing it here, the forced reflow inside animateTextEls() below
  // would let that rule silently animate this background change too.
  overlay.style.transition='none';
  overlay.style.opacity='1';
  overlay.style.transform='none';
  overlay.style.background=newBg; // background stays fixed — set directly, never animated
  // Entering split mode fresh (from Song/Bible-single/none) always counts as
  // a change for both sides, regardless of what happens to be cached from a
  // previous split session.
  var wasSplit=(currentOverlayMode==='split');
  var leftChanged=!wasSplit||_splitLastL.ref!==leftRef||_splitLastL.text!==leftText;
  var rightChanged=!wasSplit||_splitLastR.ref!==rightRef||_splitLastR.text!==rightText;
  _clearSlideLayout();
  document.getElementById('title-area').style.display='none';
  document.getElementById('content').style.display='none';
  document.getElementById('hint-area').style.display='none';
  document.getElementById('split-screen').style.display='grid';
  var refL=document.getElementById('split-ref-l'),refR=document.getElementById('split-ref-r');
  var txtL=document.getElementById('split-text-l'),txtR=document.getElementById('split-text-r');
  refL.textContent=leftRef||''; refL.style.color=titleColor||'#9b59b6';
  refR.textContent=rightRef||''; refR.style.color=titleColor||'#9b59b6';
  txtL.textContent=leftText||''; txtL.style.color=textColor||'#ffffff';
  txtR.textContent=rightText||''; txtR.style.color=textColor||'#ffffff';
  _splitLastL={ref:leftRef,text:leftText};
  _splitLastR={ref:rightRef,text:rightText};
  currentOverlayMode='split';
  if(!wasSplit){
    // ENTER — the Split Viewer wasn't already active in this window, so the
    // complete presentation (background + both sides' text, already set
    // above) fades in together using Bible's Enter Duration, reusing
    // animateLayer() (the same whole-layer fade Blank itself is built on)
    // instead of the per-side text-only animation below. animateLayer()
    // reads/consumes _transInstant itself, exactly as it does for its
    // existing 'sources-layer' callers. Also cancels/resets any still-
    // pending SWITCH text animation on either side, so a stale one can
    // never land mid-Enter and leave a side stuck part-faded.
    ['split-left','split-right'].forEach(function(k){
      if(_layerTransitionTimers[k]){clearTimeout(_layerTransitionTimers[k]);_layerTransitionTimers[k]=null;}
    });
    [document.getElementById('split-ref-area-l'),document.getElementById('split-text-area-l'),
     document.getElementById('split-ref-area-r'),document.getElementById('split-text-area-r')].forEach(function(el){
      el.style.transition='';el.style.opacity='';el.style.transform='';
    });
    animateLayer('overlay-layer',_transEnterDuration);
  } else {
    // SWITCH — already active; only the side(s) that actually changed
    // animate (text only), background stays untouched. instant is read/
    // consumed exactly once here even though up to two animateTextEls()
    // calls may follow.
    var instant=_transInstant; _transInstant=false;
    if(leftChanged)animateTextEls('split-left',[document.getElementById('split-ref-area-l'),document.getElementById('split-text-area-l')],instant,_transDuration);
    if(rightChanged)animateTextEls('split-right',[document.getElementById('split-ref-area-r'),document.getElementById('split-text-area-r')],instant,_transDuration);
  }
  setTimeout(refitAll,0);
}

// Called by Android bridge — show song/verse content on the OVERLAY layer,
// drawn on top of whatever Source is currently showing. Never touches
// #sources-layer or any Source element (custom-text/media/video/clock) —
// Sources keeps running underneath exactly as it was.
function showContent(type,titleText,bodyText,bg,titleColor,textColor,fontSize,hintText,hintColor){
  _requestedFontSize=fontSize||30;
  var overlay=document.getElementById('overlay-layer');
  var newBg=(bg&&bg.startsWith('data:'))?('url('+bg+') center/cover no-repeat'):(bg||'transparent');
  // Cancel a still-running Blank exit-fade on THIS layer and reset it to a
  // normal resting state FIRST — see the matching comment in showSplit()
  // above: a new selection must always immediately take over from a fading-
  // out Blank, never be delayed or later wiped out by that fade's deferred
  // finishClear() cleanup, regardless of whether the ENTER or SWITCH path
  // below ends up running. Harmless no-op when nothing was pending.
  if(_layerTransitionTimers['overlay-layer']){clearTimeout(_layerTransitionTimers['overlay-layer']);_layerTransitionTimers['overlay-layer']=null;}
  // transition:'none' first — see the matching comment in showSplit() above:
  // without it, the forced reflow inside animateTextEls() below would let
  // #overlay-layer's own class-level "background 0.4s ease" rule silently
  // animate this background change.
  overlay.style.transition='none';
  overlay.style.opacity='1';
  overlay.style.transform='none';
  overlay.style.background=newBg; // background stays fixed — set directly, never animated, on a slide change
  document.getElementById('split-screen').style.display='none';
  // Title area
  var titleArea=document.getElementById('title-area');
  var titleEl=document.getElementById('title');
  var hasTitle=!!titleText;
  if(hasTitle){
    titleEl.textContent=titleText;
    titleEl.style.color=titleColor||'#9b59b6';
    titleArea.style.display='flex';
  } else {
    titleArea.style.display='none';
  }
  // Content
  var contentEl=document.getElementById('content');
  contentEl.textContent=bodyText||'';
  contentEl.style.color=textColor||'#ffffff';
  contentEl.style.display='block';
  // Hint — its own dedicated 1fr row at the bottom (see .slide-title-hint), not
  // a corner overlay any more, so it always gets real space and is auto-fit.
  var hintArea=document.getElementById('hint-area');
  var hintEl=document.getElementById('hint');
  var hasHint=!!hintText;
  hintEl.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" style="width:40px;height:20px;flex-shrink:0;"><rect x="1" y="10" width="22" height="4" rx="2"/></svg><span>'+(hintText||'')+'</span>';
  // Hint color only ever matters while hintArea is actually visible — i.e. only for
  // song slides that carry a hint (Bible has no hint text, so hintColor is simply
  // never sent for it and this line has no effect).
  hintEl.style.color=hintColor||'rgba(255,255,255,0.6)';
  hintArea.style.display=hasHint?'flex':'none';
  // Container ratio: 2:7:1 (title:content:hint) with a hint, 2:8 without one —
  // see #overlay-layer.slide-title-only/.slide-title-hint in the CSS. Neither
  // class applies when there's no title at all (a titleless verse, if that
  // ever happens) — content then just gets the full overlay, same as before.
  overlay.classList.toggle('slide-title-only',hasTitle&&!hasHint);
  overlay.classList.toggle('slide-title-hint',hasTitle&&hasHint);
  // ENTER vs SWITCH is decided from the overlay's OWN current state, never
  // from the fact that a slide was merely selected: if this exact type
  // ('song' or 'bible'/'verse' — see the real Android cast bridge's own
  // showStanza()/showVerse() call sites for why the two iframes and the real
  // cast display can legitimately use different literal strings here, self-
  // consistently) wasn't already what the overlay was showing, nothing of
  // this kind was active a moment ago, so it's entering fresh.
  var wasThisType=(currentOverlayMode===type);
  currentOverlayMode=type;
  if(!wasThisType){
    // ENTER — complete presentation (background + text, already set above)
    // fades in together using this category's Enter Duration, reusing
    // animateLayer() (the same whole-layer fade Blank itself is built on)
    // instead of the text-only animation below. animateLayer() reads/
    // consumes _transInstant itself, exactly as it does for its existing
    // 'sources-layer' callers. Also cancels/resets any still-pending SWITCH
    // text animation on these elements, so a stale one can never land mid-
    // Enter and leave the text stuck part-faded.
    if(_layerTransitionTimers['overlay-text']){clearTimeout(_layerTransitionTimers['overlay-text']);_layerTransitionTimers['overlay-text']=null;}
    [titleArea,document.getElementById('content-area'),hintArea].forEach(function(el){el.style.transition='';el.style.opacity='';el.style.transform='';});
    animateLayer('overlay-layer',_transEnterDuration);
  } else {
    // SWITCH — this presentation was already active; only the text animates
    // (Switch Duration), background stays untouched — never the parent
    // #overlay-layer (which owns the background, already set above with no
    // transition at all).
    var instant=_transInstant; _transInstant=false;
    animateTextEls('overlay-text',[titleArea,document.getElementById('content-area'),hintArea],instant,_transDuration);
  }
  // Auto-fit after layout has actually settled into its new grid-row sizes.
  setTimeout(refitAll,0);
}

// Called by Android bridge — show a Source on the SOURCES (base) layer.
// SOURCES ONLY: never touches #overlay-layer or any Song/Bible element — a
// currently-showing Song/Bible overlay is left exactly as it was.
function showGap(type,text,bg,textColor,fontSize){
  _releaseSpecialSurfaces();
  _requestedSourceFontSize=fontSize||30;
  var sourcesLayer=document.getElementById('sources-layer');
  if(bg&&bg.startsWith('data:')){sourcesLayer.style.background='url('+bg+') center/cover no-repeat';}
  else{sourcesLayer.style.background=bg||'#000000';}
  document.getElementById('media').style.display='none';
  document.getElementById('video').style.display='none';
  document.getElementById('custom-text').style.display='none';
  hideClock();
  currentSourceMode='gap';
  if(type==='clock'){
    showClock();
  } else if(type==='blank'){
    // all hidden, just background
  } else if(type==='text'){
    var ct=document.getElementById('custom-text');
    ct.textContent=text||'';
    ct.style.color=textColor||'#ffffff';
    ct.style.display='block';
    setTimeout(refitAll,0);
  } else if(type==='image'){
    if(text){document.getElementById('media').src=text;document.getElementById('media').style.display='block';}
  } else if(type==='video'){
    if(text){document.getElementById('video').src=text;document.getElementById('video').style.display='block';}
  }
  animateLayer('sources-layer');
}

// Called from controller.html (same-origin iframe call, not the Android string
// bridge — a MediaStream can't cross that) to show a USB/capture camera
// source. Local monitors only for now: there is no native path yet to also
// relay a live MediaStream into the external CastPresentation display.
// SOURCES ONLY — see showGap() above.
function showCamera(stream){
  hideClock();
  document.getElementById('custom-text').style.display='none';
  document.getElementById('media').style.display='none';
  document.getElementById('video').style.display='none';
  document.getElementById('pdf-canvas').style.display='none';
  document.getElementById('pptx-fit').style.display='none';
  document.getElementById('sources-layer').style.background='#000000';
  var cam=document.getElementById('camera-video');
  if(stream){
    cam.srcObject=stream;
    cam.style.display='block';
    cam.play().catch(function(){});
  } else {
    cam.style.display='none';
  }
  currentSourceMode='camera';
  animateLayer('sources-layer');
}

// showPdf(dataUrl, pageNum) and showPptx(dataUrl, slideIndex) — real
// pdfjs-dist/@aiden0z/pptx-renderer rendering onto #pdf-canvas/#pptx-inner —
// are defined in the <script type="module"> block near the end of this file
// (they need the ES module imports in lib/renderers/); see that block's own
// comment. SOURCES ONLY — see showGap() above.

// Called by Android bridge — clear the SOURCES layer back to clock. SOURCES
// ONLY: leaves whatever Song/Bible overlay is currently showing untouched —
// use clearOverlay() (below) to clear that instead.
function clearDisplay(){
  _releaseSpecialSurfaces();
  document.getElementById('custom-text').style.display='none';
  document.getElementById('media').style.display='none';
  document.getElementById('video').style.display='none';
  document.getElementById('sources-layer').style.background='#000000';
  showClock();
  currentSourceMode='clock';
  animateLayer('sources-layer');
}

// Called by Android bridge / controller.html's Blank quick-action — SLOWLY
// fades the ENTIRE Song/Bible OVERLAY (title/content/hint/split AND its
// background — the whole #overlay-layer element, so text and background fade
// away together) out to fully transparent, THEN clears its content back to
// the empty state. Covers Song, single-verse Bible, AND the Bible Split
// Viewer in one shared mechanism, since all three only ever live on this one
// layer/background (see LAYER ARCHITECTURE) — never touches #sources-layer,
// so whatever Source is showing on the base layer is always left running
// underneath untouched.
//
// Deliberately its own timing, kept separate from the user-configurable
// slide-to-slide Transition (_transType/_transDuration/_transEasing, used by
// animateLayer() for normal slide changes) — Blank is a distinct "fade to
// nothing" action, not a slide change. The actual duration (ms) is resolved
// by the CALLER (controller.html's activateBlank()/_blankDuration()) per the
// context it's running in — the category's own Exit Duration for a direct
// user Blank click, or the category's normal Switch/Transition duration for
// Transition's internal Blank-first step — and passed in explicitly, so this
// one function never needs to know or guess why it's being called.
// BLANK_FADE_MS is only the fallback when no ms is given (defensive; every
// current caller always passes one explicitly). BLANK_FADE_EASING is fixed —
// there's no separate easing setting for Blank, only for the persistent
// Transition (_transEasing). Reuses animateLayer()'s own
// _layerTransitionTimers['overlay-layer'] slot for its pending cleanup, so a
// new showContent()/showSplit() call (which already clears that slot at the
// top of animateLayer()) always cancels a still-fading-out Blank before it
// can wipe out content just selected. CUT's one-shot instant flag
// (_transInstant) is honored the same way animateLayer() honors it — checked
// BEFORE ms is even looked at — so Blank-before-CUT stays instant regardless
// of whatever ms the caller resolved.
var BLANK_FADE_MS=700, BLANK_FADE_EASING='ease';
function clearOverlay(ms){
  var layer=document.getElementById('overlay-layer');
  if(ms==null)ms=BLANK_FADE_MS;
  // Cancel ANY in-flight animation on the overlay or its text groups —
  // the layer-wide Blank fade itself, a still-running slide-to-slide text
  // transition (overlay-text), or either Split side's text transition —
  // so nothing left over from those can fight with or undo this cleanup.
  ['overlay-layer','overlay-text','split-left','split-right'].forEach(function(k){
    if(_layerTransitionTimers[k]){clearTimeout(_layerTransitionTimers[k]);_layerTransitionTimers[k]=null;}
  });
  function finishClear(){
    _clearSlideLayout();
    var titleArea=document.getElementById('title-area'),contentArea=document.getElementById('content-area'),
        hintArea=document.getElementById('hint-area');
    titleArea.style.display='none';
    document.getElementById('content').style.display='none';
    hintArea.style.display='none';
    document.getElementById('split-screen').style.display='none';
    // Split's own text/reference nodes are cleared too — otherwise their
    // stale strings would sit hidden in the DOM and could reappear if the
    // split screen is ever shown again before a fresh showSplit() call resets
    // them. _splitLastL/_splitLastR are reset alongside so that next
    // showSplit() call always treats both sides as fresh (see their own
    // comment above showSplit()) instead of comparing against this
    // just-cleared text and wrongly skipping the fade-in.
    var refL=document.getElementById('split-ref-l'),refR=document.getElementById('split-ref-r'),
        txtL=document.getElementById('split-text-l'),txtR=document.getElementById('split-text-r'),
        refAreaL=document.getElementById('split-ref-area-l'),refAreaR=document.getElementById('split-ref-area-r'),
        txtAreaL=document.getElementById('split-text-area-l'),txtAreaR=document.getElementById('split-text-area-r');
    refL.textContent='';refR.textContent='';txtL.textContent='';txtR.textContent='';
    _splitLastL={ref:null,text:null};
    _splitLastR={ref:null,text:null};
    // Defensively reset any leftover inline opacity/transform/transition from
    // an interrupted text-only transition (animateTextEls()) on every group —
    // harmless if there was none, but never leaves a group stuck mid-fade.
    [titleArea,contentArea,hintArea,refAreaL,refAreaR,txtAreaL,txtAreaR].forEach(function(el){
      el.style.transition='';el.style.opacity='';el.style.transform='';
    });
    layer.style.background='transparent';
    currentOverlayMode='none';
    // Rest state — fully opaque again and ready for whatever shows next; the
    // fade's opacity is never permanently left behind.
    layer.style.transition='none';
    layer.style.opacity='1';
    void layer.offsetWidth;
    layer.style.transition='';
  }
  if(currentOverlayMode==='none'){
    // Already empty — nothing to fade, just make sure rest state is clean.
    layer.style.transition='';layer.style.opacity='';layer.style.transform='';
    return;
  }
  if(_transInstant||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
    _transInstant=false;
    finishClear();
    return;
  }
  // transform is also reset here (not just opacity) so the fade always starts
  // clean even if Blank interrupts a slide/zoom-type transition still mid-flight.
  layer.style.transition='opacity '+ms+'ms '+BLANK_FADE_EASING+', transform '+ms+'ms '+BLANK_FADE_EASING;
  layer.style.opacity='0';
  layer.style.transform='none';
  _layerTransitionTimers['overlay-layer']=setTimeout(finishClear,ms);
}

// Font weight update — Content font-weight control (Songs/Bible, from the
// Appearance panel). OVERLAY ONLY: #clock/#custom-text belong to Sources,
// which has no such typography setting, so they're deliberately left alone —
// a Song/Bible typography change must never restyle whatever Source is
// showing underneath. Heading (#title) is intentionally not included either:
// it's always bold (see #title's own font-weight:700 in the CSS) rather than
// user-adjustable.
function updateFontWeight(weight){
  var w=weight+'';
  document.getElementById('content').style.fontWeight=w;
  document.getElementById('split-text-l').style.fontWeight=w;
  document.getElementById('split-text-r').style.fontWeight=w;
  refitAll(); // a heavier/lighter weight can change how much a given size actually fits
}

// Live body font width (letter-spacing) — Song lyrics / verse content only;
// see updateFontWeight() above for why Sources' #custom-text is excluded.
function updateFontWidth(px){
  var ls=px+'px';
  document.getElementById('content').style.letterSpacing=ls;
  refitAll();
}

// Re-fit on resize
window.addEventListener('resize',function(){
  refitAll();
  reportPresenterViewport();
});

// Start with clock
showClock();
reportPresenterViewport();
window.addEventListener('load',reportPresenterViewport);
setTimeout(reportPresenterViewport,100);
</script>

<!-- ══════════════════════════════════════
     PDF / PPTX RENDERING ENGINES — real pdfjs-dist / @aiden0z/pptx-renderer
     rendering, sharing lib/renderers/*.js with controller.html's Source
     Controls thumbnail strip (see that file's own comment). A module script
     is deferred (runs after the classic <script> above has fully executed,
     regardless of tag order — see HTML's module-execution timing), so every
     classic-script global referenced here (hideClock, animateLayer,
     _releaseSpecialSurfaces, _applyPptxFit, _applyMediaZoomTransform,
     currentSourceMode, _pptxSlideW/H, _srcDisplayMode, …) is guaranteed to
     already exist — this only DEFINES window.showPdf/window.showPptx and
     leaves all frame/zoom/display-mode math in the classic script above,
     which already owns that for every other source type. ══════════════════════════════════════ -->
<script type="module">
import * as PdfEngine from './lib/renderers/pdf-engine.js';
import * as PptxEngine from './lib/renderers/pptx-engine.js';

var _pdfCurrent=null;  // {dataUrl,page} — the most recently REQUESTED page, used to drop stale async results
var _pptxCurrent=null; // {dataUrl,slideIndex}

// Reaches controller.html (same-origin parent for the Preview/Live mirror
// iframes) so a render failure surfaces as a real toast instead of silently
// failing — mirrors the existing window.parent.__onSourceVideoEnded bridge.
// On the real external cast display there's no parent to report to, so this
// just logs, same as this file's other "no toast possible there" spots.
function _reportRenderError(message){
  console.error(message);
  try{
    if(window.parent&&window.parent!==window&&typeof window.parent.__onSourceRenderError==='function'){
      window.parent.__onSourceRenderError(window.__frameRole||null,message);
    }
  }catch(e){}
}

window.showPdf=async function(dataUrl,pageNum){
  hideClock();
  _releaseSpecialSurfaces();
  document.getElementById('custom-text').style.display='none';
  document.getElementById('media').style.display='none';
  document.getElementById('video').style.display='none';
  document.getElementById('sources-layer').style.background='#ffffff';
  var canvas=document.getElementById('pdf-canvas');
  currentSourceMode='pdf';
  if(!dataUrl){canvas.style.display='none';_pdfCurrent=null;animateLayer('sources-layer');return;}
  canvas.style.display='block';
  var page=Math.max(1,pageNum||1);
  _pdfCurrent={dataUrl:dataUrl,page:page};
  animateLayer('sources-layer');
  try{
    var doc=await PdfEngine.loadPdf(dataUrl);
    if(!_pdfCurrent||_pdfCurrent.dataUrl!==dataUrl||_pdfCurrent.page!==page)return; // superseded by a newer call
    var box=document.getElementById('media-frame-box');
    await PdfEngine.renderPageToCanvas(doc,page,canvas,{maxW:box.clientWidth,maxH:box.clientHeight});
  }catch(e){
    _reportRenderError('Could not render PDF: '+(e&&e.message?e.message:e));
  }
};

window.showPptx=async function(dataUrl,slideIndex){
  hideClock();
  _releaseSpecialSurfaces();
  document.getElementById('custom-text').style.display='none';
  document.getElementById('media').style.display='none';
  document.getElementById('video').style.display='none';
  document.getElementById('sources-layer').style.background='#ffffff';
  var fitEl=document.getElementById('pptx-fit');
  currentSourceMode='pptx';
  if(!dataUrl){fitEl.style.display='none';_pptxCurrent=null;animateLayer('sources-layer');return;}
  fitEl.style.display='block';
  var idx=Math.max(0,slideIndex||0);
  _pptxCurrent={dataUrl:dataUrl,slideIndex:idx};
  animateLayer('sources-layer');
  try{
    var inner=document.getElementById('pptx-inner');
    var meta=await PptxEngine.renderSlideInto(dataUrl,idx,inner);
    if(!_pptxCurrent||_pptxCurrent.dataUrl!==dataUrl||_pptxCurrent.slideIndex!==idx)return; // superseded
    inner.style.width=meta.slideWidth+'px';
    inner.style.height=meta.slideHeight+'px';
    _pptxSlideW=meta.slideWidth;_pptxSlideH=meta.slideHeight;
    _applyPptxFit();
    _applyMediaZoomTransform();
  }catch(e){
    _reportRenderError('Could not render PowerPoint slide: '+(e&&e.message?e.message:e));
  }
};

// Re-renders the current PDF page at #media-frame-box's ACTUAL current pixel
// size — never re-parses the source (cached by dataUrl in pdf-engine.js).
// Called on window resize and, via setSourceFrame()'s own hook above, right
// after a Display Mode/Frame Ratio change resizes the box.
window.__reapplyPdfAtCurrentBox=function(){
  if(!_pdfCurrent||!_pdfCurrent.dataUrl)return;
  var canvas=document.getElementById('pdf-canvas');
  var box=document.getElementById('media-frame-box');
  var req=_pdfCurrent;
  PdfEngine.loadPdf(req.dataUrl).then(function(doc){
    if(_pdfCurrent!==req)return;
    return PdfEngine.renderPageToCanvas(doc,req.page,canvas,{maxW:box.clientWidth,maxH:box.clientHeight});
  }).catch(function(){});
};
window.addEventListener('resize',function(){
  window.__reapplyPdfAtCurrentBox();
  if(_pptxSlideW){
    _applyPptxFit();
    _applyMediaZoomTransform();
  }
});
</script>
</body>
</html>
